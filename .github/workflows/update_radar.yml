name: Daily Job Radar Update

on:
  schedule:
    - cron: '0 12 * * *' # Ejecuta todos los días a las 12:00 PM UTC
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde GitHub

jobs:
  update-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run job engine
      run: python engine.py

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add vacancies.json
        git commit -m "🤖 Daily Job Radar Update" || echo "No changes to commit"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
